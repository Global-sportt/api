---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  resource: "schedule"
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["authenticated"]
      condition:
        match:
          expr: |
            has(request.principal.attr.permissions) &&
            "schedule:read" in request.principal.attr.permissions &&
            (
              request.principal.attr.permissions["schedule:read"] == "platform" ||
              (
                request.principal.attr.permissions["schedule:read"] == "establishment" &&
                has(request.principal.attr.establishmentId) &&
                has(request.resource.attr.establishmentId) &&
                request.principal.attr.establishmentId == request.resource.attr.establishmentId
              )
            )
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      roles: ["authenticated"]
      condition:
        match:
          expr: |
            has(request.principal.attr.permissions) &&
            "schedule:manage" in request.principal.attr.permissions &&
            (
              request.principal.attr.permissions["schedule:manage"] == "platform" ||
              (
                request.principal.attr.permissions["schedule:manage"] == "establishment" &&
                has(request.principal.attr.establishmentId) &&
                has(request.resource.attr.establishmentId) &&
                request.principal.attr.establishmentId == request.resource.attr.establishmentId
              )
            )
