---
name: "ScheduleSuite"
description: "schedule read/manage — permission map + scope"
principals:
  owner_e1:
    id: "user_owner_e1"
    roles: ["authenticated"]
    attr:
      permissions:
        schedule:read: "establishment"
        schedule:manage: "establishment"
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: false
  owner_e2:
    id: "user_owner_e2"
    roles: ["authenticated"]
    attr:
      permissions:
        schedule:read: "establishment"
        schedule:manage: "establishment"
      establishmentId: "E2"
      membershipStatus: "active"
      isPlatformAdmin: false
  staff_e1:
    id: "user_staff_e1"
    roles: ["authenticated"]
    attr:
      permissions:
        schedule:read: "establishment"
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: false
  platform_admin:
    id: "user_admin"
    roles: ["authenticated"]
    attr:
      permissions:
        schedule:read: "platform"
        schedule:manage: "platform"
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: true
  player_a:
    id: "user_a"
    roles: ["authenticated"]
    attr:
      permissions:
        booking:read: "own"
      isPlatformAdmin: false
  no_permissions:
    id: "user_no_permissions"
    roles: ["authenticated"]
    attr:
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: false
  anonymous:
    id: "anonymous"
    roles: ["anonymous"]
    attr: {}
resources:
  schedule_e1:
    id: "SCH_E1"
    kind: "schedule"
    attr:
      establishmentId: "E1"
  schedule_e2:
    id: "SCH_E2"
    kind: "schedule"
    attr:
      establishmentId: "E2"
tests:
  - name: "owner E1 can read schedule E1"
    input:
      principals: ["owner_e1"]
      resources: ["schedule_e1"]
      actions: ["read"]
    expected:
      - principal: "owner_e1"
        resource: "schedule_e1"
        actions:
          read: EFFECT_ALLOW
  - name: "staff E1 can read schedule E1"
    input:
      principals: ["staff_e1"]
      resources: ["schedule_e1"]
      actions: ["read"]
    expected:
      - principal: "staff_e1"
        resource: "schedule_e1"
        actions:
          read: EFFECT_ALLOW
  - name: "owner E1 can manage schedule E1"
    input:
      principals: ["owner_e1"]
      resources: ["schedule_e1"]
      actions: ["manage"]
    expected:
      - principal: "owner_e1"
        resource: "schedule_e1"
        actions:
          manage: EFFECT_ALLOW
  - name: "staff E1 cannot manage schedules"
    input:
      principals: ["staff_e1"]
      resources: ["schedule_e1"]
      actions: ["manage"]
    expected:
      - principal: "staff_e1"
        resource: "schedule_e1"
        actions:
          manage: EFFECT_DENY
  - name: "owner E1 cannot manage schedule E2"
    input:
      principals: ["owner_e1"]
      resources: ["schedule_e2"]
      actions: ["manage"]
    expected:
      - principal: "owner_e1"
        resource: "schedule_e2"
        actions:
          manage: EFFECT_DENY
  - name: "platform admin can manage any schedule"
    input:
      principals: ["platform_admin"]
      resources: ["schedule_e2"]
      actions: ["manage"]
    expected:
      - principal: "platform_admin"
        resource: "schedule_e2"
        actions:
          manage: EFFECT_ALLOW
  - name: "player without schedule permission is denied"
    input:
      principals: ["player_a"]
      resources: ["schedule_e1"]
      actions: ["read"]
    expected:
      - principal: "player_a"
        resource: "schedule_e1"
        actions:
          read: EFFECT_DENY
  - name: "authenticated principal without the permission map is denied"
    input:
      principals: ["no_permissions"]
      resources: ["schedule_e1"]
      actions: ["manage"]
    expected:
      - principal: "no_permissions"
        resource: "schedule_e1"
        actions:
          manage: EFFECT_DENY
  - name: "anonymous is denied"
    input:
      principals: ["anonymous"]
      resources: ["schedule_e1"]
      actions: ["read"]
    expected:
      - principal: "anonymous"
        resource: "schedule_e1"
        actions:
          read: EFFECT_DENY
