---
name: "EstablishmentSuite"
description: "establishment read/create/update/suspend — permission map + scope"
principals:
  owner_e1:
    id: "user_owner_e1"
    roles: ["authenticated"]
    attr:
      permissions:
        establishment:read: "establishment"
        establishment:update: "establishment"
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: false
  owner_e2:
    id: "user_owner_e2"
    roles: ["authenticated"]
    attr:
      permissions:
        establishment:read: "establishment"
        establishment:update: "establishment"
      establishmentId: "E2"
      membershipStatus: "active"
      isPlatformAdmin: false
  staff_e1:
    id: "user_staff_e1"
    roles: ["authenticated"]
    attr:
      permissions:
        establishment:read: "establishment"
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: false
  platform_admin:
    id: "user_admin"
    roles: ["authenticated"]
    attr:
      permissions:
        establishment:read: "platform"
        establishment:create: "platform"
        establishment:update: "platform"
        establishment:suspend: "platform"
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: true
  wrong_scope_create:
    id: "user_wrong_scope_create"
    roles: ["authenticated"]
    attr:
      permissions:
        establishment:read: "own"
        establishment:create: "establishment"
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: false
  wrong_scope_suspend:
    id: "user_wrong_scope_suspend"
    roles: ["authenticated"]
    attr:
      permissions:
        establishment:suspend: "establishment"
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: false
  player_a:
    id: "user_a"
    roles: ["authenticated"]
    attr:
      permissions:
        booking:read: "own"
      isPlatformAdmin: false
  no_permissions:
    id: "user_no_permissions"
    roles: ["authenticated"]
    attr:
      establishmentId: "E1"
      membershipStatus: "active"
      isPlatformAdmin: false
  staff_e1_no_tenant:
    id: "user_staff_no_tenant"
    roles: ["authenticated"]
    attr:
      permissions:
        establishment:read: "establishment"
      membershipStatus: "active"
      isPlatformAdmin: false
  anonymous:
    id: "anonymous"
    roles: ["anonymous"]
    attr: {}
resources:
  establishment_e1:
    id: "E1"
    kind: "establishment"
    attr:
      establishmentId: "E1"
  establishment_e2:
    id: "E2"
    kind: "establishment"
    attr:
      establishmentId: "E2"
  establishment_new:
    id: "E_NEW"
    kind: "establishment"
    attr: {}
  establishment_no_tenant:
    id: "E0"
    kind: "establishment"
    attr: {}
tests:
  - name: "owner E1 can read establishment E1"
    input:
      principals: ["owner_e1"]
      resources: ["establishment_e1"]
      actions: ["read"]
    expected:
      - principal: "owner_e1"
        resource: "establishment_e1"
        actions:
          read: EFFECT_ALLOW
  - name: "owner E1 cannot read establishment E2"
    input:
      principals: ["owner_e1"]
      resources: ["establishment_e2"]
      actions: ["read"]
    expected:
      - principal: "owner_e1"
        resource: "establishment_e2"
        actions:
          read: EFFECT_DENY
  - name: "owner E2 cannot read establishment E1"
    input:
      principals: ["owner_e2"]
      resources: ["establishment_e1"]
      actions: ["read"]
    expected:
      - principal: "owner_e2"
        resource: "establishment_e1"
        actions:
          read: EFFECT_DENY
  - name: "staff E1 can read establishment E1"
    input:
      principals: ["staff_e1"]
      resources: ["establishment_e1"]
      actions: ["read"]
    expected:
      - principal: "staff_e1"
        resource: "establishment_e1"
        actions:
          read: EFFECT_ALLOW
  - name: "platform admin can read any establishment"
    input:
      principals: ["platform_admin"]
      resources: ["establishment_e2"]
      actions: ["read"]
    expected:
      - principal: "platform_admin"
        resource: "establishment_e2"
        actions:
          read: EFFECT_ALLOW
  - name: "player without establishment permission is denied"
    input:
      principals: ["player_a"]
      resources: ["establishment_e1"]
      actions: ["read"]
    expected:
      - principal: "player_a"
        resource: "establishment_e1"
        actions:
          read: EFFECT_DENY
  - name: "own scope is not valid for establishment reads"
    input:
      principals: ["wrong_scope_create"]
      resources: ["establishment_e1"]
      actions: ["read"]
    expected:
      - principal: "wrong_scope_create"
        resource: "establishment_e1"
        actions:
          read: EFFECT_DENY
  - name: "authenticated principal without the permission is denied"
    input:
      principals: ["no_permissions"]
      resources: ["establishment_e1"]
      actions: ["read"]
    expected:
      - principal: "no_permissions"
        resource: "establishment_e1"
        actions:
          read: EFFECT_DENY
  - name: "establishment scope without tenant attributes is denied"
    input:
      principals: ["staff_e1_no_tenant"]
      resources: ["establishment_no_tenant"]
      actions: ["read"]
    expected:
      - principal: "staff_e1_no_tenant"
        resource: "establishment_no_tenant"
        actions:
          read: EFFECT_DENY
  - name: "anonymous is denied"
    input:
      principals: ["anonymous"]
      resources: ["establishment_e1"]
      actions: ["read"]
    expected:
      - principal: "anonymous"
        resource: "establishment_e1"
        actions:
          read: EFFECT_DENY
  - name: "platform admin can create an establishment without resource tenant"
    input:
      principals: ["platform_admin"]
      resources: ["establishment_new"]
      actions: ["create"]
    expected:
      - principal: "platform_admin"
        resource: "establishment_new"
        actions:
          create: EFFECT_ALLOW
  - name: "owner cannot create an establishment"
    input:
      principals: ["owner_e1"]
      resources: ["establishment_new"]
      actions: ["create"]
    expected:
      - principal: "owner_e1"
        resource: "establishment_new"
        actions:
          create: EFFECT_DENY
  - name: "establishment scope cannot create an establishment"
    input:
      principals: ["wrong_scope_create"]
      resources: ["establishment_new"]
      actions: ["create"]
    expected:
      - principal: "wrong_scope_create"
        resource: "establishment_new"
        actions:
          create: EFFECT_DENY
  - name: "owner E1 can update establishment E1"
    input:
      principals: ["owner_e1"]
      resources: ["establishment_e1"]
      actions: ["update"]
    expected:
      - principal: "owner_e1"
        resource: "establishment_e1"
        actions:
          update: EFFECT_ALLOW
  - name: "owner E1 cannot update establishment E2"
    input:
      principals: ["owner_e1"]
      resources: ["establishment_e2"]
      actions: ["update"]
    expected:
      - principal: "owner_e1"
        resource: "establishment_e2"
        actions:
          update: EFFECT_DENY
  - name: "platform admin can update without resource tenant"
    input:
      principals: ["platform_admin"]
      resources: ["establishment_new"]
      actions: ["update"]
    expected:
      - principal: "platform_admin"
        resource: "establishment_new"
        actions:
          update: EFFECT_ALLOW
  - name: "platform admin can suspend any establishment"
    input:
      principals: ["platform_admin"]
      resources: ["establishment_e2"]
      actions: ["suspend"]
    expected:
      - principal: "platform_admin"
        resource: "establishment_e2"
        actions:
          suspend: EFFECT_ALLOW
  - name: "establishment scope cannot suspend"
    input:
      principals: ["wrong_scope_suspend"]
      resources: ["establishment_e1"]
      actions: ["suspend"]
    expected:
      - principal: "wrong_scope_suspend"
        resource: "establishment_e1"
        actions:
          suspend: EFFECT_DENY
